[project]
name = "sourcekit"
version = "0.1.0"
description = "Tools for finding source material and converting it to text"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = ["ruff>=0.17.4"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["tools/*"]

[tool.ruff]
line-length = 120
