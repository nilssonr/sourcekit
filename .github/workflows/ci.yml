name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The opt-in live and PDF-backed tests skip themselves when these are unset.
      ARXIV_LIVE: ""
      DOC_CONVERTER_PDF: ""
      DOC_CONVERTER_REF: ""
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.7"
          enable-cache: true
      - name: Install the workspace from the lock file
        run: uv sync --all-packages --locked
      - name: arxiv-client tests
        working-directory: tools/arxiv-client
        run: uv run python -m unittest discover -s tests -t . -v
      - name: doc-converter tests
        working-directory: tools/doc-converter
        run: uv run python -m unittest discover -s tests -v
