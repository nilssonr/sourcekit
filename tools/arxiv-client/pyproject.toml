[project]
name = "arxiv-client"
version = "0.1.0"
description = "Standard-library client for arXiv's query API, announcement feeds and PDFs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Robin Nilsson", email = "robin.ingemar.nilsson@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
arxiv = "arxiv_client.__main__:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
