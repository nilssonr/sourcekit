[project]
name = "doc-converter"
version = "0.1.0"
description = "Convert a born-digital PDF into verbatim Markdown, with a verifier"
readme = "README.md"
authors = [
    { name = "Robin Nilsson", email = "robin.ingemar.nilsson@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pymupdf>=2.1,<2.2",
]

[project.scripts]
doc-converter = "doc_converter.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
